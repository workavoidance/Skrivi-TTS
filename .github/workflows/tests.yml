name: Reader and library tests
on: [push, pull_request]
jobs:
  library:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install langdetect==1.0.9
      - run: python -m unittest discover -s tests -p 'test_*.py'

  packaged-reader:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .build-env
      - run: ./.build-env/Scripts/python.exe -m pip install -r requirements-build.lock
      - name: Build and smoke-test frozen reader
        shell: pwsh
        run: ./scripts/build.ps1
